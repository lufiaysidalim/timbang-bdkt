 ["Kepercayaan dan Untung",()=>`<p><b>Nilai produk</b> = gram x harga per gram, atau jumlah satuan x harga per satuan.</p><p><b>Kepercayaan turun</b></p><p>• Waktu habis, kemasan belum diisi: <b>-20%</b>. Kas tidak berkurang karena tidak ada produk terbuang.</p><p>• Waktu habis, kemasan sudah ada isinya tetapi belum dikemas: <b>-25%</b> dan kas berkurang sebesar nilai produk di dalam kemasan. Produk yang belum dikemas bisa tumpah sewaktu-waktu dan mudah kedaluwarsa.</p><p>• Sudah dikemas tetapi kurang dari label: turun <b>2x persen kekurangan</b>, maksimal -20% (kurang 10% atau lebih). Contoh: kurang 2% = -4%. Perisai menahan penurunan ini.</p><p><b>Kepercayaan naik</b></p><p>• Sudah dikemas dan lebih dari label: naik <b>0,5x persen kelebihan</b>, maksimal +5% (lebih 10% atau lebih). Contoh: lebih 2% = +1%.</p><p><b>Untung kas</b></p><p>• Isi kurang: untung maksimal 10% nilai produk sesuai label.<br>• Isi tepat: untung 10% nilai produk.<br>• Berlebih: untung berkurang sebesar persen kelebihan (lebih 2% = untung 8%). Lebih dari 10%: untung 0% dan kelebihan di atas 10% menjadi kerugian (lebih 15% = rugi 5% nilai produk).</p><p><b>Salah cairan</b>: Tuang Cairan pada produk selain bobot tuntas (permen, wafer, coklat, keripik ubi, kacang, tepung, kecap, minyak, air mineral) mengkontaminasi isi. Rugi sebesar nilai produk yang sudah masuk kemasan.</p>`],
