 ["Cara Bermain",()=>`<p>Isi kemasan sampai isinya <b>tepat sama dengan label</b>, lalu tekan Kemas <kbd>Enter</kbd>.</p>${h4("Empat jenis takaran")}${rwp("permen",11,"<b>Jumlah</b>: hitung butir yang masuk (2 sampai 10 butir; mulai Lv 31: 5 sampai 20 butir).")}${rwp("ubi",11,"<b>Berat</b> (gram): baca timbangan. Tare <kbd>T</kbd> menolkan berat kemasan.")}${rwp("sarden",11,"<b>Bobot tuntas</b> (mulai Lv 46): isi produk padat dulu sampai bobot tuntas, lalu Tuang Cairan <kbd>Shift</kbd> sampai berat bersih.")}${rwp("air",11,"<b>Volume</b> (mulai Lv 71): cairan dalam mL. Perhatikan massa jenis tiap cairan.")}${h4("Timbangan, waktu, dan kaca pembesar")}${ul(["Timbangan menampilkan gram untuk kemasan beserta isinya. Setelah Tare, yang terbaca hanya isi bersih (tulisan TARE tampil di kiri atas layar timbangan).","Makin lama Tuang Produk ditahan, makin deras alirannya.","Kurangi <kbd>Backspace</kbd> mengeluarkan sebagian isi bila kelebihan.","Tiap kemasan punya batas waktu. Bar hijau di bawah area permainan makin pendek dan berubah kuning lalu merah.","Kaca pembesar di sisi kemasan memperbesar keterangan kuantitas pada label (merek, keterangan, angka, dan satuan).","Tinggi isi di kemasan sebanding dengan beratnya. Kemasan penuh berarti isi sudah mencapai ujung atas bagian bening (tepi atas jendela, bibir kaleng, atau leher botol), yaitu berat label +10% (minimal +1 g). Mulai Lv 66 isi sampai titik itu tumpah."])}<p>Hasil dan akibatnya dijelaskan di dua slide berikutnya.</p>`],
 ["Kepercayaan dan Untung",()=>`<p><b>Nilai produk</b> = gram x harga per gram, atau jumlah satuan x harga per satuan.</p>${h4("Kepercayaan turun")}${ul(["Waktu habis, kemasan belum diisi: <b>-20%</b>. Kas tidak berkurang karena tidak ada produk terbuang.","Waktu habis, kemasan sudah ada isinya tetapi belum dikemas: <b>-25%</b> dan kas berkurang sebesar nilai produk di kemasan. Produk yang belum dikemas bisa tumpah sewaktu-waktu dan mudah kedaluwarsa.","Sudah dikemas tetapi kurang dari label: turun <b>2x persen kekurangan</b>, maksimal -20% (kurang 10% atau lebih). Contoh: kurang 2% = -4%. Perisai menahan penurunan ini."])}${h4("Kepercayaan naik")}${ul(["Sudah dikemas dan lebih dari label: naik <b>0,5x persen kelebihan</b>, maksimal +5% (lebih 10% atau lebih). Contoh: lebih 2% = +1%."])}${h4("Untung kas")}${ul(["Isi kurang: untung maksimal 10% nilai produk sesuai label.","Isi tepat: untung 10% nilai produk.","Berlebih: untung berkurang sebesar persen kelebihan (lebih 2% = untung 8%).","Lebih dari 10%: untung 0% dan kelebihan di atas 10% menjadi kerugian (lebih 15% = rugi 5% nilai produk).","Bobot tuntas: untung 10% x nilai bobot tuntas (hanya produk utama, bukan 10% x berat bersih).","Bobot tuntas: kelebihan cairan pengisi dihargai Rp 20 per gram dan mengurangi untung. Sebelum Lv 66 belum ada aturan tumpah, jadi kelebihan bisa sangat banyak sampai merugikan kas.","Bobot tuntas: kelebihan produk utama (jamur, buah, sarden) tetap mengurangi untung sesuai harga produknya. Bila lebih dari bobot tuntas +10%, untung habis dan kas berkurang."])}${h4("Salah cairan")}<p>Tuang Cairan pada produk selain bobot tuntas (permen, wafer, coklat, keripik ubi, kacang, tepung, kecap, minyak, air mineral) mengkontaminasi isi. Rugi sebesar nilai produk yang sudah masuk kemasan.</p>`],
 ["Skor dan Bonus",()=>`${h4("Poin tiap kemasan")}${ul(["Poin = 100 dikurangi 10 x persen kelebihan. Isi tepat = 100 poin (SEMPURNA).","Bintang: 1 bila ada poin, 2 bila poin 60 atau lebih, 3 bila poin 100.","Kurang atau berlebih jauh: tanpa poin, dan level tidak naik."])}${h4("Bonus")}${ul(["<b>Beruntun SEMPURNA</b>: mulai SEMPURNA ke-4 berturut-turut, bonus 50 x (jumlah beruntun dikurangi 3) di tiap kemasan berikutnya.","<b>Tanpa cela</b>: tiap 10 kemasan berturut-turut tanpa hasil kurang, waktu habis, atau kontaminasi, bonus 300."])}${h4("Top Score")}<p>Skor terbaik tersimpan di peramban Anda dan tampil di sisi kanan atas area permainan.</p>`],
